name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, architecture, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the packageManager field of package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format (Biome)
        run: pnpm lint

      - name: Type check (tsc)
        run: pnpm typecheck

      - name: Architecture rules (dependency-cruiser)
        run: pnpm check:architecture

      - name: Tests (Vitest)
        run: pnpm test
