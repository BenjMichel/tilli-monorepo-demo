# Local PostgreSQL for the API (ADR 0007). Start with `docker compose up -d`, then:
#   DATABASE_URL=postgres://tilli:tilli@127.0.0.1:5432/tilli pnpm --filter @tilli/api start
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tilli
      POSTGRES_PASSWORD: tilli
      POSTGRES_DB: tilli
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tilli -d tilli"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
